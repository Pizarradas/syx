<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" class="demo-iso" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Caja con ventilador girando</title>
  <style>
    /* syx-reuse: checked --semantic-accent, --semantic-surface — la ilustración necesita 3 tonos por material */
    .demo-iso {
      --demo-iso-fondo: var(--semantic-surface, #f4f1ea);
      --demo-iso-sombra: var(--semantic-surface-sunken, #e2dccf);
      --demo-iso-ambar-techo: var(--semantic-accent-subtle, #e8b04a);
      --demo-iso-ambar-izq: var(--semantic-accent, #c98a2b);
      --demo-iso-ambar-der: var(--semantic-accent-strong, #9a6418);
      --demo-iso-rejilla: var(--semantic-accent-strong, #9a6418);
      --demo-iso-aspa: var(--semantic-ink, #3b2a12);
    }
    .demo-iso-fondo { fill: var(--demo-iso-fondo); }
    .demo-iso-sombra { fill: var(--demo-iso-sombra); }
    .demo-iso-techo { fill: var(--demo-iso-ambar-techo); stroke: var(--demo-iso-ambar-techo); stroke-width: .5; }
    .demo-iso-izq { fill: var(--demo-iso-ambar-izq); stroke: var(--demo-iso-ambar-izq); stroke-width: .5; }
    .demo-iso-der { fill: var(--demo-iso-ambar-der); stroke: var(--demo-iso-ambar-der); stroke-width: .5; }
    .demo-iso-rejilla { fill: var(--demo-iso-rejilla); }
    .demo-iso-aspa { fill: var(--demo-iso-aspa); }

    @property --iso-u { syntax: "&lt;number&gt;"; inherits: false; initial-value: 0; }
    @property --iso-v { syntax: "&lt;number&gt;"; inherits: false; initial-value: 0; }
    @property --iso-w { syntax: "&lt;number&gt;"; inherits: false; initial-value: 0; }

    .demo-iso [data-iso-part] {
      transform: translate(
        calc((var(--iso-u) - var(--iso-v)) * 0.8660254px),
        calc((var(--iso-u) + var(--iso-v)) * 0.5px - var(--iso-w) * 1px)
      );
    }
    .demo-iso-ventilador__aspas { transform-box: fill-box; transform-origin: center; }

    @media (prefers-reduced-motion: no-preference) {
      .demo-iso [data-iso-part="caja"] { animation: demo-iso-flotar 2.4s ease-in-out infinite alternate; }
      .demo-iso-ventilador__aspas { animation: demo-iso-girar 1.2s linear infinite; }
    }
    @keyframes demo-iso-flotar { to { --iso-w: 6; } }
    @keyframes demo-iso-girar { to { transform: rotate(1turn); } }
  </style>

  <rect class="demo-iso-fondo" width="240" height="200"/>

  <!-- Sombra en el suelo (w=0), desplazada en u: no se anima -->
  <g transform="matrix(0.8660254 0.5 -0.8660254 0.5 130.39 96)">
    <rect class="demo-iso-sombra" width="64" height="64"/>
  </g>

  <!-- Caja: origen del mundo (120,90), lado 64, alto 48 -->
  <g data-iso-part="caja">
    <g transform="matrix(0.8660254 0.5 0 1 64.57 122)">
      <rect class="demo-iso-izq" y="-48" width="64" height="48"/>
    </g>
    <g transform="matrix(-0.8660254 0.5 0 1 175.43 122)">
      <rect class="demo-iso-der" y="-48" width="64" height="48"/>
    </g>
    <g transform="matrix(0.8660254 0.5 -0.8660254 0.5 120 42)">
      <rect class="demo-iso-techo" width="64" height="64"/>
      <circle class="demo-iso-rejilla" cx="32" cy="32" r="22"/>
      <g class="demo-iso-ventilador__aspas">
        <path class="demo-iso-aspa" d="M32 32 L28 13 Q32 10 36 13 Z"/>
        <path class="demo-iso-aspa" d="M32 32 L51 28 Q54 32 51 36 Z"/>
        <path class="demo-iso-aspa" d="M32 32 L36 51 Q32 54 28 51 Z"/>
        <path class="demo-iso-aspa" d="M32 32 L13 36 Q10 32 13 28 Z"/>
      </g>
    </g>
  </g>
</svg>
