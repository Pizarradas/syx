# SYX — Publicación de una versión
# ════════════════════════════════
# Hasta la 4.28 las versiones solo existían en package.json y en el CHANGELOG:
# no había etiquetas, ni releases, ni forma de instalar «la 4.27» desde GitHub.
# Esto lo cierra con una sola acción humana: empujar una etiqueta.
#
#   npm version minor --no-git-tag-version   # o patch / major
#   (escribir la sección «## [x.y.z] — fecha» en CHANGELOG.md)
#   npm run build:metricas                    # escribe metrics/x.y.z.json
#   git add -A && git commit -m "release: x.y.z" && git tag vx.y.z && git push --follow-tags
#
# TRES TRABAJOS, CADA UNO CON LO MÍNIMO (auditoría 2026-11, F0-05)
#   construir  contents: read · sin secretos. Comprueba que la etiqueta,
#              package.json y el CHANGELOG dicen la misma versión, pasa la
#              cadena entera, empaqueta UNA vez y guarda el .tgz con su sha256.
#   release    contents: write · no instala nada ni ejecuta código del repo:
#              solo sube ese .tgz y las hojas minificadas a la release.
#   npm        id-token: write · no hace checkout ni `npm ci`: descarga el
#              .tgz de la release, comprueba que su sha256 es el que salió de
#              «construir» y lo publica con --ignore-scripts. Así ninguna
#              devDependency se ejecuta con permiso de publicar, y lo que
#              llega a npm es, byte a byte, lo que hay en la release.
#
# Antes (hasta la 5.1) era un solo trabajo con contents: write, id-token y el
# NPM_TOKEN a la vez, después de `npm ci`: cualquier dependencia de desarrollo
# comprometida podía publicar. Y `npm publish` volvía a empaquetar, así que el
# .tgz de npm y el de la release no eran necesariamente el mismo.
#
# npm: NO publica salvo que alguien lo decida en el repositorio, con la
# variable PUBLICAR_NPM = true. Publicar en un registro público es
# irreversible y es una decisión de quien mantiene el paquete.
# Autenticación: Trusted Publishing (OIDC), sin token guardado. Requiere, una
# vez, en npmjs.com → syx-design-system → Settings → Trusted publisher:
# GitHub Actions · organización Pizarradas · repositorio syx · workflow
# release.yml · entorno npm · acción permitida «npm publish». La procedencia
# (provenance) la genera npm automáticamente con OIDC.
# (Auditoría 2026-09 · acción 22; auditoría 2026-11 · F0-05)

name: Publicación

on:
  push:
    tags: ['v*.*.*']

# Nada por defecto: cada trabajo pide lo suyo.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construir:
    name: Construir ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tgz: ${{ steps.empaquetar.outputs.tgz }}
      sha256: ${{ steps.empaquetar.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: La etiqueta, package.json y el CHANGELOG dicen lo mismo
        run: |
          ETIQUETA="${GITHUB_REF_NAME#v}"
          PAQUETE="$(node -p "require('./package.json').version")"
          if [ "$ETIQUETA" != "$PAQUETE" ]; then
            echo "::error::La etiqueta dice $ETIQUETA y package.json dice $PAQUETE"
            exit 1
          fi
          # Sección fechada y [Unreleased] vacía, o no hay release.
          mkdir -p salida
          node scripts/release-notes.js "$PAQUETE" --verificar > salida/notas.md

      - name: La etiqueta apunta a un commit de main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME apunta a $GITHUB_SHA, que no está en main: se publica lo que se ha fusionado y revisado, no una rama"
            exit 1
          fi

      - name: El CSS commiteado es el compilado
        run: node scripts/check-limpio.js --strict

      - name: npm run check
        run: npm run check

      - name: Identidad de git para las pruebas
        run: |
          git config --global user.email "ci@syx.local"
          git config --global user.name "SYX CI"

      - name: El paquete se instala y responde
        run: npm run check:consumible

      - name: axe sobre todos los componentes, temas y modos
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node run.mjs --axe

      - name: Empaquetar una sola vez
        id: empaquetar
        run: |
          npm run build:dist
          TGZ="$(npm pack --pack-destination salida --silent | tail -n 1)"
          tar -czf "salida/syx-dist-${GITHUB_REF_NAME}.tar.gz" dist
          SHA="$(sha256sum "salida/$TGZ" | cut -d' ' -f1)"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$TGZ · sha256 $SHA" >> "$GITHUB_STEP_SUMMARY"

      # El registro de la versión (F1-08) tiene que ser lo que mide este árbol:
      # dist/ ya está construido, así que mide lo que se publica.
      - name: Las métricas commiteadas son las de esta versión
        run: |
          node scripts/build-metricas.js --check
          cp "metrics/${GITHUB_REF_NAME#v}.json" "salida/metricas-${GITHUB_REF_NAME}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publicacion
          path: salida/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release ${{ github.ref_name }}
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear la release y subir sus ficheros
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publicacion
          path: salida

      - name: El .tgz es el que salió de construir
        env:
          TGZ: ${{ needs.construir.outputs.tgz }}
          SHA: ${{ needs.construir.outputs.sha256 }}
        run: echo "$SHA  salida/$TGZ" | sha256sum -c -

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
          TGZ: ${{ needs.construir.outputs.tgz }}
        run: |
          # Si ya existe, es un reintento: npm no llegó a publicarse y hay que poder
          # relanzar sin borrar la release.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # El .tgz que ya tiene tiene que ser el que acaba de salir: si no, npm
            # recibiría algo distinto de lo que se revisó en la release.
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$TGZ" --dir existente
            if ! cmp -s "existente/$TGZ" "salida/$TGZ"; then
              echo "::error::La release $GITHUB_REF_NAME ya tiene un $TGZ distinto del que se acaba de construir. Bórrala o publica otra versión."
              exit 1
            fi
            echo "La release ya existe con el mismo .tgz: se sigue con npm."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SYX ${GITHUB_REF_NAME}" \
              --notes-file salida/notas.md \
              --verify-tag \
              "salida/$TGZ" "salida/syx-dist-${GITHUB_REF_NAME}.tar.gz" "salida/metricas-${GITHUB_REF_NAME}.json"
          fi

  npm:
    name: npm ${{ github.ref_name }}
    needs: [construir, release]
    if: vars.PUBLICAR_NPM == 'true'
    runs-on: ubuntu-latest
    # El entorno permite exigir una aprobación manual antes de publicar
    # (Settings → Environments → npm) y es parte de la identidad que npm
    # comprueba en el Trusted publisher.
    environment: npm
    permissions:
      contents: read    # descargar el .tgz de la release
      id-token: write   # OIDC con npm: sin token guardado
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted Publishing pide npm ≥ 11.5.1, que trae Node 24. Sin caché:
          # en un trabajo que publica no se reutiliza nada de otra ejecución.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Descargar de la release el .tgz que se va a publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TGZ: ${{ needs.construir.outputs.tgz }}
          SHA: ${{ needs.construir.outputs.sha256 }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$TGZ" --dir publicar
          echo "$SHA  publicar/$TGZ" | sha256sum -c -

      - name: Publicar en npm ese mismo .tgz, sin ejecutar scripts
        env:
          TGZ: ${{ needs.construir.outputs.tgz }}
        run: |
          npm --version
          npm publish "./publicar/$TGZ" --access public --ignore-scripts --provenance
