# SYX — Confianza
# ═══════════════
# Clasifica el diff de una PR con contracts/trust.json. ROMPE si toca rutas
# `human` y la PR no lleva la etiqueta `aprobado-humano` (scripts/
# check-confianza.js explica por qué una etiqueta y qué no prueba).
#
# POR QUÉ pull_request_target
# Con `pull_request`, el YAML que se ejecuta es el de la PR: una PR podía
# añadir `|| true` al paso y dejar «Confianza» en verde (auditoría 2026-10 II).
# Con `pull_request_target` el YAML, el guardián y el contrato son SIEMPRE los
# de la rama base. La PR solo aporta su diff: se descarga en pr/ con git (no
# con actions/checkout) y no se ejecuta NADA de ella (ni npm, ni scripts):
# git lee sus ficheros y basta.
#
# LA APROBACIÓN CADUCA CON CADA PUSH
# Antes, `aprobado-humano` seguía valiendo tras nuevos commits: se aprobaba
# una versión y se fusionaba otra. Ahora, en cada `synchronize` se quita la
# etiqueta y la PR vuelve a necesitarla si toca `human`.
#
# QUIÉN APRUEBA
# La etiqueta solo cuenta si la puso una persona con permiso maintain o admin
# (ver el paso «Rutas human y pr del cambio»).
#
# Sustituye al job «Confianza» de ci.yml y a la reevaluación al etiquetar:
# este workflow escucha también `labeled` y `unlabeled`, con un job del mismo
# nombre, así que la protección de rama sigue viendo «Confianza».

name: SYX · Confianza

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write   # solo para quitar la etiqueta en cada push

concurrency:
  group: confianza-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  confianza:
    name: Confianza
    runs-on: ubuntu-latest
    steps:
      # La base: el guardián, su contrato y este YAML.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # La PR, solo como datos: con toda la historia para el diff contra la
      # base, y la base visible como origin/<rama>. Nunca se ejecuta nada de aquí.
      #
      # Con git y no con actions/checkout: desde 2026-10 checkout se niega a
      # bajar el código de un fork en un pull_request_target salvo con
      # `allow-unsafe-pr-checkout: true`, y toda PR desde un fork fallaba aquí
      # antes de leer la etiqueta. Esa opción no hace falta: el riesgo que
      # vigila es EJECUTAR el código de la PR, y este job solo lo lee con git.
      # refs/pull/<n>/head vive en este mismo repositorio venga de donde venga
      # la PR, y se pide el head_sha exacto del evento: lo juzgado es lo que
      # el evento dice, no lo último que se haya subido después.
      - name: La PR y la base, solo como datos
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          git init -q pr
          git -C pr fetch --no-tags "https://github.com/$REPO" \
            "+refs/pull/$PR/head:refs/remotes/pr/head" \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git -C pr cat-file -e "$HEAD_SHA^{commit}" || git -C pr fetch --no-tags "https://github.com/$REPO" "$HEAD_SHA"
          git -C pr checkout -q --detach "$HEAD_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: La aprobación caduca con cada push
        if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'aprobado-humano')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --remove-label aprobado-humano
          echo "Se ha quitado \`aprobado-humano\`: la aprobación era de la versión anterior." >> "$GITHUB_STEP_SUMMARY"

      # Las etiquetas, leídas DESPUÉS de quitarla: el evento trae las de antes.
      #
      # QUIÉN PUSO LA ETIQUETA (auditoría 2026-11, F0-10)
      # Antes valía la pusiera quien la pusiera: un agente con un token de
      # escritura podía abrir una PR que toca `human` y aprobársela. Ahora
      # `aprobado-humano` solo cuenta si la puso, la última vez, una cuenta de
      # persona (type User, no Bot ni app) con permiso maintain o admin. No se
      # exige que sea distinta del autor: SYX tiene un solo mantenedor y él
      # abre las PR. Si no se cumple, la etiqueta se ignora (no se quita) y el
      # guardián juzga la PR como no aprobada.
      - name: Rutas human y pr del cambio
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR" --jq '{pull_request: {labels: .labels}}' > "$RUNNER_TEMP/evento.json"
          if jq -e '.pull_request.labels | map(.name) | index("aprobado-humano")' "$RUNNER_TEMP/evento.json" > /dev/null; then
            QUIEN="$(gh api --paginate "repos/$REPO/issues/$PR/events" \
              --jq '.[] | select(.event == "labeled" and .label.name == "aprobado-humano") | "\(.actor.login) \(.actor.type)"' | tail -n 1)"
            LOGIN="${QUIEN%% *}"; TIPO="${QUIEN##* }"
            ROL="$( [ -n "$LOGIN" ] && gh api "repos/$REPO/collaborators/$LOGIN/permission" --jq '.role_name' 2>/dev/null || echo desconocido)"
            if [ "$TIPO" = "User" ] && { [ "$ROL" = "admin" ] || [ "$ROL" = "maintain" ]; }; then
              echo "\`aprobado-humano\` la puso $LOGIN ($ROL)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::aprobado-humano no cuenta: la puso ${LOGIN:-nadie} (${TIPO:-?}, rol ${ROL:-?}); hace falta una persona con permiso maintain o admin"
              echo "\`aprobado-humano\` **no cuenta**: la puso ${LOGIN:-nadie} (${TIPO:-?}, rol ${ROL:-?})." >> "$GITHUB_STEP_SUMMARY"
              jq '.pull_request.labels |= map(select(.name != "aprobado-humano"))' "$RUNNER_TEMP/evento.json" > "$RUNNER_TEMP/e2.json"
              mv "$RUNNER_TEMP/e2.json" "$RUNNER_TEMP/evento.json"
            fi
          fi
          GITHUB_EVENT_PATH="$RUNNER_TEMP/evento.json" node base/scripts/check-confianza.js --repo pr
