# SYX — Integración continua
# ═══════════════════════════
# Durante cuatro versiones se construyeron ocho guardianes —temas, versión,
# tokens, registro, MCP, escáner, paquete y el validador— y todos esperaban a
# que alguien se acordara de escribir `npm run check`. Un guardián que depende
# de la memoria de alguien no es un guardián, es una costumbre.
#
# CÓMO ESTÁ REPARTIDO
#   contratos   en cada push · rápido · es el que decide si algo está roto
#   entrega     solo en PR · lento · empaqueta, instala y construye de verdad
#   desviación  informativo · nunca rompe · deja el informe a la vista
#   navegador   PR y main · axe, foco, reflow y páginas rompen; la regresión
#               visual informa
#   confianza   solo en PR · segundos · rompe si toca rutas `human` sin aprobar
#   mutación    solo en PR · minutos · rompe si un guardián deja pasar la
#               regresión que dice parar
#
# Lo lento va en los PR y no en cada push a propósito: `check:consumible`
# empaqueta 10 MB y los instala, y `check:propuesta` copia el árbol y compila.
# Pagar eso en cada `git push` haría que alguien acabara desactivando esto.

name: SYX

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela el anterior: lo que importa es el
# veredicto del último commit, no la cola de los que ya no existen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contratos:
    name: Contratos · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` promete >=20.19: es lo que exige sass 1.103 (su CLI carga
        # chokidar 5, solo ESM). Prometía >=18 y la pata 18 no podía pasar
        # (auditoría 2026-10, acción 10). La matriz cubre el suelo exacto y
        # las dos LTS siguientes.
        node: ['20.19', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Primero, y sobre el árbol recién clonado: comprueba que el CSS
      # commiteado es exactamente el que sale de compilar. Va antes que nada
      # porque `npm run check` termina compilando, y después ya no se podría
      # distinguir lo que había de lo que acaba de generarse.
      - name: El CSS commiteado es el compilado
        run: node scripts/check-limpio.js --strict

      # Validador R01–R07, simetría de temas, coherencia de versión, snapshot de
      # tokens, huérfanos, registro de componentes, servidor MCP, escáner, mixins,
      # coherencia de los modos, codificación, paquete y build.
      - name: npm run check
        run: npm run check

  entrega:
    name: Entrega
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # `check-propuesta.js` crea ramas y commits en una copia en /tmp; sin
      # identidad configurada, `git commit` falla dentro del contenedor.
      - name: Identidad de git para las pruebas
        run: |
          git config --global user.email "ci@syx.local"
          git config --global user.name "SYX CI"

      - name: El paquete se instala y responde
        run: npm run check:consumible

      # El Quick Start del README, tal cual: empaqueta, instala en un proyecto
      # Vite vacío, copia del README los bloques <!-- quickstart:… -->,
      # `vite build` y Chromium. Es lo único que ve que un import de js/ se
      # pierde en el tree-shaking de producción (auditoría 2026-10, acción 11).
      # Playwright sale del arnés de tests/browser; Vite solo del temporal.
      - name: Playwright para la prueba del Quick Start
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: El Quick Start del README funciona en producción
        run: npm run check:quickstart

      - name: La vía de propuesta acierta y se niega donde debe
        run: npm run check:propuesta

  # Clasifica el diff de la PR con contracts/trust.json y lo deja en el resumen
  # del job. ROMPE si toca rutas `human` y la PR no lleva la etiqueta
  # `aprobado-humano` (scripts/check-confianza.js explica por qué una etiqueta
  # y qué no prueba). Poner o quitar la etiqueta no dispara este workflow
  # —volvería a correr todo lo lento—: lo vuelve a evaluar confianza.yml, con
  # un job del mismo nombre.
  confianza:
    name: Confianza
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Con toda la historia: el diff es `origin/<base>...HEAD`, y sin la rama
      # base el guardián falla en vez de aprobar a ciegas.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # El guardián y el contrato, tal como están en la BASE: una PR no
      # reescribe a su propio juez. Solo si la base aún no tiene el guardián
      # (la PR que lo introduce) se usa el de la PR. Sin `npm ci`: no tiene
      # dependencias.
      - name: Rutas human y pr del cambio
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "origin/$GITHUB_BASE_REF"
          if [ -f "$RUNNER_TEMP/base/scripts/check-confianza.js" ]; then
            node "$RUNNER_TEMP/base/scripts/check-confianza.js" --repo "$GITHUB_WORKSPACE"
          else
            echo "La base no tiene aún scripts/check-confianza.js: se usa el de la PR."
            node scripts/check-confianza.js
          fi

  navegador:
    name: Navegador · axe, foco, reflow, páginas y regresión visual
    runs-on: ubuntu-latest
    # En los PR y en main. En cada push a cualquier rama sería lento para lo
    # que aporta: lo que se fusiona pasa siempre por aquí.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      # La raíz también: su `prepare` genera dist/, que es el CSS que cargan
      # las páginas del sitio (sitio.mjs y reflow.mjs las prueban con él).
      - name: Dependencias de la raíz (y dist/)
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # ROMPE. WCAG 2.2 A y AA con axe-core sobre cada componente del registro,
      # en los siete temas y los dos modos. Los incompletos (lo que axe no
      # sabe decidir) también rompen salvo revisados; los de contraste se
      # miden en píxeles. Lo aceptado a sabiendas está en
      # axe-excepciones.json, acotado y con caducidad.
      - name: axe sobre todos los componentes, temas y modos
        run: node run.mjs --axe

      # ROMPE. El teclado y las regiones vivas que prometen js/syx-*.js:
      # menú (APG), tooltip (WCAG 1.4.13), toast y contador de caracteres.
      - name: Teclado y regiones vivas
        run: node interaccion.mjs

      # ROMPE. Lo que axe no ve: el foco de cada enfocable se distingue en
      # píxeles (2.4.7/2.4.11/2.4.13), Tab recorre sin trampas y un diálogo
      # modal atrapa.
      - name: Foco visible, orden de Tab y trampas
        run: node foco.mjs

      # ROMPE. A 320 px nada se desplaza en horizontal (1.4.10) y los
      # objetivos miden 24 × 24 (2.5.8), en componentes y páginas.
      - name: Reflow a 320 px y tamaño de objetivo
        run: node reflow.mjs

      # ROMPE. Las cuatro páginas del sitio en axe a 375 y 1280 px, claro y
      # oscuro, y el cajón móvil con el teclado.
      - name: Las páginas del sitio y el cajón móvil
        run: node sitio.mjs

      # NO ROMPE. La referencia es la rama base, fotografiada en esta misma
      # máquina con este mismo arnés: no hay capturas versionadas que se
      # desfasen con cada versión de Chromium. Un cambio visual puede ser
      # justo el que se buscaba; lo decide quien revisa, con las imágenes.
      - name: Capturas del cambio
        if: github.event_name == 'pull_request'
        run: node run.mjs --capturas out/despues

      - name: Capturas de la rama base
        if: github.event_name == 'pull_request'
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          node run.mjs --capturas out/antes --raiz "$RUNNER_TEMP/base"

      - name: Comparar
        if: github.event_name == 'pull_request'
        run: |
          node comparar.mjs out/antes out/despues diferencias diferencias/informe.md
          cat diferencias/informe.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: regresion-visual
          path: |
            tests/browser/diferencias/
            tests/browser/out/despues/
          retention-days: 14

  # Los guardianes, probados con regresiones de verdad: cada caso copia el
  # árbol, inyecta UNA regresión realista (un primitivo en un átomo, el
  # primario casi blanco, scripts/ a auto en trust.json, un componente sin
  # foco…) y exige que su guardián la pare y diga por qué. Tarda minutos —
  # copia el árbol una vez por caso y recompila temas—, así que va en los PR.
  mutacion:
    name: Mutación · los guardianes guardan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Playwright y Chromium para el caso de foco.
      - name: Arnés de navegador
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Regresión · guardián · resultado
        run: |
          node scripts/check-mutacion.js | tee mutacion.txt
          { echo '## Mutación'; echo; echo '```'; cat mutacion.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  desviacion:
    name: Desviación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Este paso NO rompe: es el informe completo, con los avisos bajos a la
      # vista. El guardián ya existe aparte: `check:vitrina`, dentro de
      # `npm run check`, falla si aparece cualquier desviación alta o media en
      # las cuatro páginas del sistema (auditoría 2026-09, acción 19).
      - name: Informe de desviación
        run: |
          {
            echo '## Desviación respecto al sistema'
            echo
            echo '```'
            node scripts/scan-drift.js home.html docs.html why-syx.html theme-builder.html || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
